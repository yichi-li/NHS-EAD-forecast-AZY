[project]
name = "nhs-ead-forecast"
version = "0.1.0"
description = "SPHERE-PPL NHS-EAD-Forecast competition entry"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsforecast>=1.7",
    "holidays>=0.50",
    "tqdm>=4.66",
    "pytest>=8.0",
    "optuna>=3.6",
]

[tool.uv]
package = false
